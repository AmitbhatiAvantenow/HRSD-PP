<svg width="220" height="180" viewBox="0 0 220 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .htp-hi-float { animation: htpHiFloat 4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes htpHiFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    .htp-hi-draw { stroke-dasharray: 220; stroke-dashoffset: 220; animation: htpHiDraw 1.4s ease forwards .2s; }
    @keyframes htpHiDraw { to { stroke-dashoffset: 0; } }
    .htp-hi-bar { transform-box: fill-box; transform-origin: bottom; animation: htpHiRise .8s ease both; }
    .htp-hi-bar-1 { animation-delay: .3s; }
    .htp-hi-bar-2 { animation-delay: .45s; }
    .htp-hi-bar-3 { animation-delay: .6s; }
    @keyframes htpHiRise { from { transform: scaleY(0); opacity: 0; } to { transform: scaleY(1); opacity: 1; } }
    .htp-hi-pulse { animation: htpHiPulse 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes htpHiPulse { 0%, 100% { transform: scale(1); opacity: .85; } 50% { transform: scale(1.08); opacity: 1; } }
  </style>
  <defs>
    <linearGradient id="hiLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="hiBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
    </linearGradient>
  </defs>

  <g class="htp-hi-float">
    <!-- bars -->
    <rect class="htp-hi-bar htp-hi-bar-1" x="14" y="118" width="16" height="40" rx="4" fill="url(#hiBar)" opacity="0.85"/>
    <rect class="htp-hi-bar htp-hi-bar-2" x="38" y="96" width="16" height="62" rx="4" fill="url(#hiBar)" opacity="0.85"/>
    <rect class="htp-hi-bar htp-hi-bar-3" x="62" y="132" width="16" height="26" rx="4" fill="url(#hiBar)" opacity="0.85"/>

    <!-- baseline -->
    <line x1="10" y1="160" x2="118" y2="160" stroke="#a78bfa" stroke-opacity="0.35" stroke-width="1.5"/>

    <!-- sparkline -->
    <polyline class="htp-hi-draw" points="12,90 40,70 62,80 86,45 108,55 128,20"
              fill="none" stroke="url(#hiLine)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle class="htp-hi-pulse" cx="128" cy="20" r="6" fill="#7c3aed"/>
  </g>

  <!-- document / tablet card -->
  <g class="htp-hi-float" style="animation-delay:.4s">
    <rect x="140" y="60" width="66" height="88" rx="14" fill="#ffffff" fill-opacity="0.55"/>
    <rect x="140" y="60" width="66" height="88" rx="14" fill="none" stroke="#ffffff" stroke-opacity="0.7" stroke-width="1.5"/>
    <rect x="154" y="80" width="38" height="6" rx="3" fill="#7c3aed" fill-opacity="0.45"/>
    <rect x="154" y="94" width="30" height="6" rx="3" fill="#7c3aed" fill-opacity="0.3"/>
    <rect x="154" y="108" width="34" height="6" rx="3" fill="#7c3aed" fill-opacity="0.3"/>
    <rect x="154" y="122" width="22" height="6" rx="3" fill="#7c3aed" fill-opacity="0.3"/>

    <circle class="htp-hi-pulse" cx="196" cy="66" r="12" fill="#7c3aed" style="animation-delay:.6s"/>
    <path d="M191 66 a5 5 0 1 1 3 4.6" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M191 66 l0 -3 l-2 2" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
